[package]
name = "balaclava"
version = "1.3.0"
description = "Balaclava — 2D Pixel-Art Survival & Fantasy RPG"
authors = ["Vice Studios <00lallel@gmail.com>"]
license = "MIT"
repository = "https://github.com/Lallelsito/Balaclava"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
rpcdiscord = "0.2.6"
windows = { version = "0.62", features = ["Foundation", "Media_Control"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
