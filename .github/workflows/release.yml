name: Release Windows Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Windows installers
        run: npm run build

      - name: Stage unsigned installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-unsigned | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" -Destination release-unsigned/ -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" -Destination release-unsigned/ -ErrorAction SilentlyContinue
          Get-ChildItem release-unsigned/

      - name: Upload unsigned installers artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installers
          path: release-unsigned/*
          if-no-files-found: error

      - name: Submit signing request to SignPath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORG_ID != '' }}
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'balaclava' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signed

      - name: Prepare final release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-final | Out-Null
          if (Test-Path "release-signed" -and (Get-ChildItem "release-signed" -File).Count -gt 0) {
            Copy-Item "release-signed/*" -Destination release-final/
          } else {
            Copy-Item "release-unsigned/*" -Destination release-final/
          }
          Get-ChildItem release-final/ | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 release-final/SHA256SUMS.txt
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Balaclava ${{ inputs.tag || github.ref_name }}"
          files: release-final/*
          generate_release_notes: true
